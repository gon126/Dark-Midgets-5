<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dark Midgets 5 - Home</title>
<style>
    body { 
        margin: 0; 
        background: radial-gradient(circle at top, #0a0a0e, #050508 45%, #000 100%); 
        color: #c5b8a5; 
        font-family: monospace; 
        display: flex; 
        justify-content: center; 
        align-items: flex-start; 
        min-height: 100vh; 
        overflow-y: auto; 
        position: relative; 
        padding: 20px 0;
    }
    
    /* Dark Souls-like ambient particles */
    body::before { 
        content: ""; 
        position: absolute; 
        inset: 0; 
        background: 
            radial-gradient(circle at 20% 20%, rgba(255,100,50,0.03), transparent 20%), 
            radial-gradient(circle at 80% 30%, rgba(100,50,255,0.02), transparent 20%),
            radial-gradient(circle at 50% 80%, rgba(255,50,50,0.02), transparent 25%);
        pointer-events: none; 
        animation: ambientPulse 8s ease-in-out infinite;
    }
    
    @keyframes ambientPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
    }
    
    /* Ember particles */
    .ember {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(255, 100, 30, 0.6);
        border-radius: 50%;
        pointer-events: none;
        animation: emberFloat linear infinite;
        box-shadow: 0 0 6px rgba(255, 100, 30, 0.4);
    }
    
    @keyframes emberFloat {
        0% { transform: translateY(100vh) scale(1); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-20px) scale(0.5); opacity: 0; }
    }
    
    .container { 
        position: relative; 
        background: rgba(10, 8, 12, 0.92); 
        padding: 40px 60px; 
        border-radius: 12px; 
        border: 2px solid rgba(180, 150, 100, 0.2); 
        box-shadow: 
            0 0 60px rgba(255, 80, 30, 0.08),
            inset 0 0 60px rgba(0, 0, 0, 0.5);
        text-align: center; 
        backdrop-filter: blur(8px); 
        animation: fadeIn 1s ease-out; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        max-width: 500px;
    }
    
    h1 { 
        margin-bottom: 20px; 
        font-size: 44px; 
        color: #d4c5a0; 
        text-shadow: 0 0 20px rgba(255, 120, 50, 0.3), 0 2px 4px rgba(0,0,0,0.8); 
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    @keyframes glow { 
        0% { text-shadow: 0 0 8px rgba(255,150,50,0.3); } 
        100% { text-shadow: 0 0 20px rgba(255,150,50,0.5); } 
    }
    
    input, select { 
        width: 280px; 
        font-size: 16px; 
        padding: 10px 14px; 
        margin: 10px 0; 
        border-radius: 6px; 
        border: 1px solid rgba(180, 150, 100, 0.3); 
        outline: none; 
        background: rgba(15, 12, 10, 0.95); 
        color: #c5b8a5; 
        transition: 0.25s ease;
        font-family: monospace;
    }
    
    input:focus, select:focus { 
        box-shadow: 0 0 14px rgba(255, 150, 50, 0.3); 
        border-color: rgba(255, 150, 50, 0.5);
        background: rgba(20, 15, 12, 0.95); 
    }
    
    /* Main buttons */
    .main-btn { 
        width: 280px; 
        padding: 14px; 
        font-size: 18px; 
        border: 2px solid rgba(180, 150, 100, 0.3); 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: bold; 
        margin-top: 15px; 
        transition: 0.3s;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-family: monospace;
    }
    
    .btn-start {
        background: rgba(120, 40, 30, 0.8);
        color: #f5e6d0;
        box-shadow: 0 0 20px rgba(255, 50, 30, 0.2);
    }
    .btn-start:hover { 
        background: rgba(160, 50, 30, 0.95); 
        box-shadow: 0 0 30px rgba(255, 80, 40, 0.4); 
        transform: scale(1.04);
        border-color: rgba(255, 100, 50, 0.5);
    }
    
    .btn-tutorial {
        background: rgba(30, 60, 40, 0.8);
        color: #c5e0d0;
        box-shadow: 0 0 15px rgba(30, 120, 60, 0.2);
    }
    .btn-tutorial:hover { 
        background: rgba(40, 80, 50, 0.95); 
        box-shadow: 0 0 25px rgba(40, 160, 80, 0.3); 
        transform: scale(1.04);
        border-color: rgba(60, 200, 100, 0.5);
    }
    
    /* Prestige panel buttons */
    .prestige-btn {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        background: rgba(30, 30, 50, 0.8);
        color: #c5b8a5;
        border: 1px solid rgba(180, 150, 100, 0.2);
        border-radius: 4px;
        cursor: pointer;
        font-family: monospace;
        transition: 0.25s;
        margin-bottom: 8px;
    }
    .prestige-btn:hover {
        background: rgba(50, 50, 80, 0.95);
        box-shadow: 0 0 10px rgba(80, 80, 150, 0.3);
    }
    .prestige-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    
    @keyframes fadeIn { 
        0% { opacity: 0; transform: translateY(20px); } 
        100% { opacity: 1; transform: translateY(0); } 
    }
    
    #classDescription { 
        margin-top: 20px; 
        padding: 15px; 
        border: 1px solid rgba(180, 150, 100, 0.3); 
        border-radius: 6px; 
        width: 300px; 
        text-align: left; 
        background: rgba(0, 0, 0, 0.4); 
        font-size: 14px; 
        box-shadow: 0 0 8px rgba(255, 150, 50, 0.2); 
    }
    
    #classDescription h3 { 
        color: #c59050; 
        margin-top: 0; 
        border-bottom: 1px solid rgba(180, 150, 100, 0.3); 
        padding-bottom: 8px; 
        text-align: center; 
        font-size: 16px;
    }
    
    .stat-line { margin-bottom: 5px; }
    .good-stat { color: #60c080; }
    .bad-stat { color: #ff6040; }
    
    html, body { height: 100%; }
    
    /* Decorative line */
    .decorative-line {
        width: 60%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.4), transparent);
        margin: 10px auto;
    }
</style>
</head>
<body>

<!-- Ember particles -->
<div id="embers"></div>

<div class="container">
    <h1>Dark Midgets 5</h1>
    <div class="decorative-line"></div>
    
    <input id="nameInput" type="text" placeholder="Enter your name" autocomplete="off" />
    
    <select id="classSelect" onchange="updateClassDescription()">
        <option value="Ranger" data-desc="The standard, balanced starting profile. Good for beginners.">Ranger</option>
        <option value="Gunner" data-desc="Fast firing, lower damage, excellent for crowd control.">Gunner</option>
        <option value="Brawler" data-desc="High damage, high HP, but very slow movement and firing.">Brawler</option>
        <option value="Acolyte" data-desc="Balanced stats with a minor starting health regeneration bonus.">Acolyte</option>
        <option value="Sniper" data-desc="Extremely high damage and bullet speed, offset by a very long cooldown.">Sniper</option>
        <option value="Scout" data-desc="Highest movement speed for dodging, decent fire rate, low damage.">Scout</option>
        <option value="Engineer" data-desc="Lowest damage but the fastest fire rate, excellent for early upgrades.">Engineer</option>
        <option value="Templar" data-desc="Highest starting HP pool, moderate damage, very slow firing.">Templar</option>
        <option value="Berserker" data-desc="Massive damage, agonizingly slow cooldown, low max HP.">Berserker (under construction)</option>
        <option value="Warlock" data-desc="Focus on life recovery with good damage and substantial health regen.">Warlock</option>
        <option value="Summoner" data-desc="High HP, fast fire, low damage. Relies on supporting abilities (pets/debuffs) later.">Summoner</option>
        <option value="Alchemist" data-desc="Drops corrosive flasks to create lingering damaging pools. Ideal for crowd control.">Alchemist</option>
        <option value="Paladin" data-desc="Highest base HP regen, very high max HP, but slowest movement. A defensive tank.">Paladin</option>
        <option value="Revenant" data-desc="Very high damage and speed, but extremely low HP and no regen. High risk, high reward.">Revenant</option>
    </select>
    
    <select id="difficultySelect">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>
    
    <label style="color: #a89880; font-size: 14px;"><input type="checkbox" id="hardcoreCheckbox"> Hardcore Mode</label>
    <label style="color: #a89880; font-size: 14px; display:block; margin-top:8px;"><input type="checkbox" id="journeyCheckbox"> Journey Mode (20-round hard boss run)</label>
    
    <button class="main-btn btn-start" onclick="startGame()">⚔ Start Game</button>
    <button class="main-btn btn-tutorial" onclick="openTutorial()">📖 Tutorial</button>
    
    <div id="prestigePanel" style="margin-top: 24px; width: 100%; max-width: 360px; text-align: left; border: 1px solid rgba(180, 150, 100, 0.2); padding: 16px; border-radius: 8px; background: rgba(0,0,0,0.4);">
        <h3 style="margin-top:0; color:#c59050; text-align:center; font-size:16px;">Metaprogression</h3>
        <div style="margin-bottom:6px; color:#a89880; font-size:13px;">Best Round: <strong id="bestRound" style="color:#d4c5a0;">0</strong></div>
        <div style="margin-bottom:6px; color:#a89880; font-size:13px;">Soul Currency: <strong id="soulCurrency" style="color:#d4c5a0;">0</strong></div>
        <div style="margin-bottom:12px; color:#a89880; font-size:13px;">Total XP Earned: <strong id="totalXp" style="color:#d4c5a0;">0</strong></div>
        <div style="margin-bottom:12px; color:#a89880; font-size:13px;">Journey Wallet: <strong id="journeyCash" style="color:#d4c5a0;">0</strong>$</div>
        <button class="prestige-btn" id="buyHpBuff" onclick="buyPrestige('hp')">Spend 20 Soul for +5% Max HP</button>
        <button class="prestige-btn" id="buySpeedBuff" onclick="buyPrestige('speed')">Spend 20 Soul for +5% Speed</button>
        <div id="perkStatus" style="margin-top:12px; font-size:13px; color:#8a7a60;"></div>
    </div>
    
    <div id="classDescription"></div>
</div>

<script>
// Create ember particles
function createEmbers() {
    const container = document.getElementById('embers');
    for (let i = 0; i < 12; i++) {
        const ember = document.createElement('div');
        ember.className = 'ember';
        ember.style.left = Math.random() * 100 + 'vw';
        ember.style.animationDuration = (4 + Math.random() * 6) + 's';
        ember.style.animationDelay = (Math.random() * -8) + 's';
        ember.style.width = (2 + Math.random() * 3) + 'px';
        ember.style.height = ember.style.width;
        container.appendChild(ember);
    }
}

function getClassStats(className) {
    let stats = { movementSpeed: 4, damage: 20, regen: 0, bulletSpeed: 100, shootCooldown: 15, maxHp: 100 };
    switch(className) {
        case "Gunner": stats.damage = 15; stats.shootCooldown = 5; stats.bulletSpeed = 120; break;
        case "Brawler": stats.damage = 35; stats.movementSpeed = 3; stats.maxHp = 120; stats.shootCooldown = 20; break;
        case "Acolyte": stats.damage = 18; stats.regen = 0.1 / 60; stats.maxHp = 110; break;
        case "Sniper": stats.damage = 50; stats.shootCooldown = 40; stats.bulletSpeed = 180; break;
        case "Scout": stats.movementSpeed = 6; stats.damage = 15; stats.shootCooldown = 12; break;
        case "Engineer": stats.damage = 10; stats.shootCooldown = 4; stats.bulletSpeed = 90; break;
        case "Templar": stats.maxHp = 150; stats.movementSpeed = 3.5; stats.damage = 25; stats.shootCooldown = 25; break;
        case "Ranger": break;
        case "Berserker": stats.damage = 60; stats.shootCooldown = 60; stats.maxHp = 90; break;
        case "Warlock": stats.damage = 22; stats.regen = 0.2 / 60; stats.shootCooldown = 18; break;
        case "Summoner": stats.maxHp = 120; stats.movementSpeed = 3.5; stats.damage = 15; stats.shootCooldown = 10; stats.regen = 0.1 / 60; break;
        case "Alchemist": stats.maxHp = 110; stats.movementSpeed = 3.2; stats.damage = 20; stats.shootCooldown = 22; stats.regen = 0.08 / 60; break;
        case "Paladin": stats.maxHp = 140; stats.movementSpeed = 3.0; stats.damage = 25; stats.shootCooldown = 15; stats.regen = 0.3 / 60; break;
        case "Revenant": stats.maxHp = 80; stats.movementSpeed = 5.5; stats.damage = 50; stats.shootCooldown = 8; stats.regen = 0; break;
    }
    return stats;
}

function updateClassDescription() {
    const select = document.getElementById("classSelect");
    const className = select.value;
    const description = select.options[select.selectedIndex].getAttribute('data-desc');
    select.title = description;
    const stats = getClassStats(className);
    const container = document.getElementById("classDescription");
    const regenPerSecond = (stats.regen * 60).toFixed(2);
    const speedColor = stats.movementSpeed >= 4.5 ? 'good-stat' : (stats.movementSpeed <= 3.5 ? 'bad-stat' : '');
    const damageColor = stats.damage >= 30 ? 'good-stat' : (stats.damage <= 15 ? 'bad-stat' : '');
    const cooldownColor = stats.shootCooldown <= 10 ? 'good-stat' : (stats.shootCooldown >= 20 ? 'bad-stat' : '');
    const hpColor = stats.maxHp >= 110 ? 'good-stat' : (stats.maxHp <= 90 ? 'bad-stat' : '');
    const regenColor = regenPerSecond > 0.1 ? 'good-stat' : (regenPerSecond > 0 ? '' : 'bad-stat');
    container.innerHTML = `<h3>${className} Class Stats</h3><p style="color:#a89880;margin:8px 0;">${description}</p><div class="stat-line">Max HP: <span class="${hpColor}">${stats.maxHp}</span></div><div class="stat-line">Movement Speed: <span class="${speedColor}">${stats.movementSpeed}</span></div><div class="stat-line">Damage: <span class="${damageColor}">${stats.damage}</span></div><div class="stat-line">Fire Cooldown: <span class="${cooldownColor}">${stats.shootCooldown} Frames</span></div><div class="stat-line">Bullet Speed: <span>${stats.bulletSpeed}</span></div><div class="stat-line">HP Regen: <span class="${regenColor}">${regenPerSecond} / sec</span></div>`;
}

function loadHomeProgress() {
    const storedSoul = parseInt(localStorage.getItem('soulCurrency') || '0', 10);
    const storedRound = parseInt(localStorage.getItem('bestRound') || '0', 10);
    const storedTotalXp = parseInt(localStorage.getItem('totalXpEarned') || '0', 10);
    const storedJourneyCash = parseInt(localStorage.getItem('journeyCash') || '0', 10);
    const hpBuffCount = parseInt(localStorage.getItem('hpBuffCount') || '0', 10);
    const speedBuffCount = parseInt(localStorage.getItem('speedBuffCount') || '0', 10);
    document.getElementById('soulCurrency').innerText = Math.max(0, storedSoul);
    document.getElementById('journeyCash').innerText = Math.max(0, storedJourneyCash);
    document.getElementById('bestRound').innerText = Math.max(0, storedRound);
    document.getElementById('totalXp').innerText = Math.max(0, storedTotalXp);
    document.getElementById('perkStatus').innerText = `HP Buffs: ${hpBuffCount} (+${hpBuffCount * 5}% Max HP) | Speed Buffs: ${speedBuffCount} (+${speedBuffCount * 5}% Move Speed)`;
    document.getElementById('buyHpBuff').disabled = storedSoul < 20;
    document.getElementById('buySpeedBuff').disabled = storedSoul < 20;
}

function saveHomeProgress() {
    const storedSoul = parseInt(localStorage.getItem('soulCurrency') || '0', 10);
    localStorage.setItem('soulCurrency', storedSoul);
}

function buyPrestige(type) {
    let soulCurrency = parseInt(localStorage.getItem('soulCurrency') || '0', 10);
    if (soulCurrency < 20) { alert('You need 20 Soul to buy a permanent buff.'); return; }
    soulCurrency -= 20;
    localStorage.setItem('soulCurrency', soulCurrency);
    if (type === 'hp') { const count = parseInt(localStorage.getItem('hpBuffCount') || '0', 10) + 1; localStorage.setItem('hpBuffCount', count); }
    else { const count = parseInt(localStorage.getItem('speedBuffCount') || '0', 10) + 1; localStorage.setItem('speedBuffCount', count); }
    loadHomeProgress();
}

function startGame() {
    const name = document.getElementById("nameInput").value.trim();
    const difficulty = document.getElementById("difficultySelect").value;
    const playerClass = document.getElementById("classSelect").value;
    const hardcore = document.getElementById("hardcoreCheckbox").checked;
    const journey = document.getElementById("journeyCheckbox").checked;
    if(!name) { alert("Please enter your name!"); return; }
    let url;
    if (journey) {
        url = "rounded_game.html?journey=true&difficulty=hard&class=" + playerClass;
    } else {
        url = "game.html?difficulty=" + difficulty + "&class=" + playerClass;
    }
    const hardcoreNames = ["eliad ben ilay", "nehorai"];
    if(["ofir", "eliad ben ilay", "nehorai", "maya", "efrat"].includes(name.toLowerCase())) { url += "&birthday=true"; }
    if(hardcoreNames.includes(name.toLowerCase()) || hardcore) { url += "&hardcore=true"; }
    else { url += "&name=" + encodeURIComponent(name); }
    window.location.href = url;
}

function openTutorial() {
    window.location.href = 'tutorial.html';
}

// Initialize
document.addEventListener('DOMContentLoaded', () => { 
    updateClassDescription(); 
    loadHomeProgress(); 
    createEmbers();
});
</script>

</body>
</html>
